name: CodeQL

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        # Weekly, off the top of the hour to avoid GitHub Actions load spikes.
        - cron: "23 4 * * 1"

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ["javascript-typescript"]

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
              with:
                  category: "/language:${{ matrix.language }}"
